<body>
    <div id="geral">
        <h3>Escreva um programa que leia as medidas dos lados de um
            triângulo e escreva se ele é equilátero, isósceles ou
            escaleno. Sendo que:
            • Triângulo Equilátero: possui os 3 lados iguais.
            • Triângulo Isóscele: possui 2 lados iguais.
            • Triângulo Escaleno: possui 3 lados diferentes</h3>

        <form id="formulario">
            <label for="num1">Triângulo Equilátero</label>
            <input type="text" name="num1" id="num1">

            <label for="num2">Triângulo Isóscele</label>
            <input type="text" name="num2" id="num2">

            <label for="num3">Triângulo Escaleno</label>
            <input type="text" name="num3" id="num3">

            <button type="submit"> Calcular</button>
            <button type="resert"> Limpar</button>
        </form>

        <div id="resultado">
        </div>
    </div>
    
</body>
